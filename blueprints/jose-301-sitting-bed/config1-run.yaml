# Config 1: Solo sentarse en la cama
# Notificación: SITTING_IN_BED
# Objetivo: Probar que detectamos cuando José se sienta

scene:
  bed: "bed-4"
  night: "night-jose-301"
  resident: "jose"
  monitor: "m1"

calibration:
  transitions: RELEASE_2
  confidence:
    SITTING_IN_BED: 0.8
    STANDING: 0.7
    IN_BATHROOM: 0.75
  dwell:
    # sin dwell — solo detección de transición
  heartbeat:
    timeout: 90s

events:
  source: "events.dat"
  output: "output-config1"
  start: "2024-01-15T22:00:00Z"
