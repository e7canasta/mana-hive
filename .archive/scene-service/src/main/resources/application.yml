spring:
  application:
    name: scene-engine
  main:
    banner-mode: off

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.manahive.scene: INFO
    org.springframework: INFO

nats:
  url: nats://localhost:4222
  cluster: manahive
  durable: scene-engine

sweep:
  interval: 5s

calibration:
  heartbeat-timeout: 90s
