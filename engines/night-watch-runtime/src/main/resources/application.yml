spring:
  application:
    name: night-watch-runtime
  main:
    banner-mode: off

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info

nats:
  url: nats://localhost:4222

logging:
  level:
    com.manahive.runtime: INFO
    org.springframework: INFO
