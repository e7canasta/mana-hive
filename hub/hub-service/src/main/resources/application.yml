spring:
  application:
    name: hub-service
  main:
    banner-mode: off
  # Hoy el hub guarda todo en memoria: HubInfrastructureConfiguration declara
  # InMemoryLedger, InMemoryPolicyLayerStore y compania, y no hay una sola linea
  # de JDBC en el modulo. Con el starter de jdbc en el classpath y sin URL
  # configurada, Spring se niega a arrancar por un DataSource que nadie usa.
  #
  # Estaba excluido solo en los tests, asi que el arranque probado y el que se
  # envia eran configuraciones distintas: los tests pasaban y `bootRun` moria.
  # Se quita la exclusion —y el starter— cuando aparezca el primer repositorio real.
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.manahive.hub: INFO
    org.springframework: INFO

nats:
  url: nats://localhost:4222
  cluster: manahive
