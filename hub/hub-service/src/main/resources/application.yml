spring:
  application:
    name: hub-service
  main:
    banner-mode: off

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.manahive.hub: INFO
    org.springframework: INFO

nats:
  url: nats://localhost:4222
  cluster: manahive
