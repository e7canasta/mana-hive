openapi: 3.1.0
info:
  title: Virtual Rounds Hub API - Poblacion
  version: 0.1.0
  description: >-
    Contrato HTTP del contexto de poblacion F3: padron de residentes,
    asignaciones residente-cama y egreso. Sirve desde Rust.
servers:
  - url: http://localhost:8780
    description: Desarrollo local
tags:
  - name: poblacion
paths:
  /api/v1/residents:
    get:
      operationId: listResidents
      tags: [poblacion]
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Filtro por nombre (substring, case-insensitive)
      responses:
        '200':
          description: Padron de residentes con su cama asignada (si tiene)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResidentsResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createResident
      tags: [poblacion]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResidentRequest'
      responses:
        '201':
          description: Residente creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResidentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/residents/{residentId}:
    parameters:
      - name: residentId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getResident
      tags: [poblacion]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Detalle del residente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResidentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateResident
      tags: [poblacion]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResidentRequest'
      responses:
        '200':
          description: Residente actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResidentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/residents/{residentId}/discharge:
    parameters:
      - name: residentId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: dischargeResident
      tags: [poblacion]
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DischargeRequest'
      responses:
        '200':
          description: Residente egresado (asignacion abierta cerrada en la misma transaccion)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResidentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Residente ya egresado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/residents/{residentId}/assignments:
    parameters:
      - name: residentId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listResidentAssignments
      tags: [poblacion]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Historial de asignaciones del residente (ordenado por starts_at asc)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentsResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createAssignment
      tags: [poblacion]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignBedRequest'
      responses:
        '201':
          description: Asignacion creada (asignaciones previas de ambos lados cerradas en la misma transaccion)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Residente o cama inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/beds/{bedId}/assignment:
    parameters:
      - name: bedId
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: releaseBed
      tags: [poblacion]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Asignacion cerrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La cama no tiene una asignacion abierta (ya esta libre)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    RoomRef:
      type: object
      required: [id, number, wing_id, wing_name]
      properties:
        id:
          type: string
        number:
          type: string
        wing_id:
          type: string
        wing_name:
          type: string
    ResidentListItem:
      type: object
      required: [id, full_name, status]
      properties:
        id:
          type: string
        external_id:
          type: string
          nullable: true
        full_name:
          type: string
        birth_date:
          type: string
          nullable: true
          description: Fecha de nacimiento (YYYY-MM-DD)
        admission_date:
          type: string
          nullable: true
          description: Fecha de ingreso (YYYY-MM-DD)
        status:
          type: string
          enum: [active, discharged]
        discharged_at:
          type: string
          nullable: true
          description: Fecha de egreso (YYYY-MM-DD)
        room:
          $ref: '#/components/schemas/RoomRef'
          nullable: true
          description: Habitacion de la cama asignada (read model compuesto)
        bed_id:
          type: string
          nullable: true
    ResidentRecord:
      type: object
      required: [id, full_name, status, created_at, updated_at]
      properties:
        id:
          type: string
        external_id:
          type: string
          nullable: true
        full_name:
          type: string
        birth_date:
          type: string
          nullable: true
        admission_date:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, discharged]
        discharged_at:
          type: string
          nullable: true
        discharged_by:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ResidentsResponse:
      type: object
      required: [residents]
      properties:
        residents:
          type: array
          items:
            $ref: '#/components/schemas/ResidentListItem'
    ResidentResponse:
      type: object
      required: [resident]
      properties:
        resident:
          $ref: '#/components/schemas/ResidentRecord'
    BedAssignmentRecord:
      type: object
      required: [id, resident_id, bed_id, starts_at, created_at]
      properties:
        id:
          type: string
        resident_id:
          type: string
        bed_id:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          nullable: true
    AssignmentsResponse:
      type: object
      required: [assignments]
      properties:
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/BedAssignmentRecord'
    AssignmentResponse:
      type: object
      required: [assignment]
      properties:
        assignment:
          $ref: '#/components/schemas/BedAssignmentRecord'
    CreateResidentRequest:
      type: object
      required: [full_name]
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 120
        external_id:
          type: string
          maxLength: 120
        birth_date:
          type: string
          description: Fecha de nacimiento (YYYY-MM-DD)
        admission_date:
          type: string
          description: Fecha de ingreso (YYYY-MM-DD)
    UpdateResidentRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 120
        external_id:
          type: string
          nullable: true
          maxLength: 120
        birth_date:
          type: string
          nullable: true
        admission_date:
          type: string
          nullable: true
    DischargeRequest:
      type: object
      properties:
        discharged_at:
          type: string
          description: Fecha de egreso (YYYY-MM-DD). Si se omite, usa la fecha actual.
    AssignBedRequest:
      type: object
      required: [bed_id]
      properties:
        bed_id:
          type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
  responses:
    Unauthenticated:
      description: Falta una sesion valida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Capability insuficiente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Recurso inexistente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Argumentos invalidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
