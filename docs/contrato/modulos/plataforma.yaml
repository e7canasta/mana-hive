openapi: 3.1.0
info:
  title: Virtual Rounds Hub API - Plataforma
  version: 0.1.0
  description: >-
    Contrato HTTP del contexto de plataforma. El archivo se mantiene a mano;
    los DTOs Rust y los clientes TypeScript son implementaciones separadas.
servers:
  - url: http://localhost:8780
    description: Desarrollo local
tags:
  - name: platform
paths:
  /health:
    get:
      operationId: getHealth
      tags: [platform]
      security: []
      responses:
        '200':
          description: Proceso disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  "*":
    options:
      operationId: corsPreflight
      tags: [platform]
      summary: Preflight CORS sobre cualquier path
      description: >
        Comodin, no una ruta: la API atiende `OPTIONS` de cualquier path exista
        o no, y contesta `204`. Enumerarlo por ruta no lo expresaria.
      responses:
        "204":
          description: Sin contenido, con las cabeceras CORS

components:
  schemas:
    HealthResponse:
      type: object
      required: [ok, service, database]
      properties:
        ok:
          type: boolean
        service:
          type: string
        database:
          type: string
