openapi: 3.1.0
info:
  title: Virtual Rounds Hub API - Cobertura
  version: 0.1.0
  description: >-
    Contrato HTTP del contexto de cobertura F4: grilla laboral, grupos de staff,
    membresias temporales y cobertura de alas. Sirve desde Rust.
servers:
  - url: http://localhost:8780
    description: Desarrollo local
tags:
  - name: cobertura
paths:
  /api/v1/facilities/{facilityId}/shifts:
    parameters:
      - name: facilityId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getShiftGrid
      tags: [cobertura]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Grilla de turnos de la facility
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftGridResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: replaceShiftGrid
      tags: [cobertura]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceShiftGridRequest'
      responses:
        '200':
          description: Grilla reemplazada; coverages_cleared indica cuantas
            coberturas quedaron sin turno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftGridResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/staff-groups:
    get:
      operationId: listStaffGroups
      tags: [cobertura]
      security:
        - bearerAuth: []
      parameters:
        - name: facility_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Grupos activos de la facility
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffGroupsResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createStaffGroup
      tags: [cobertura]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffGroupRequest'
      responses:
        '201':
          description: Grupo creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffGroupResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/staff-groups/{groupId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getStaffGroup
      tags: [cobertura]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Detalle del grupo con miembros actuales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffGroupDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateStaffGroup
      tags: [cobertura]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStaffGroupRequest'
      responses:
        '200':
          description: Grupo actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffGroupResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/staff-groups/{groupId}/members:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: replaceMembers
      tags: [cobertura]
      security:
        - bearerAuth: []
      description: >-
        Reemplaza las membresias activas del grupo. Cierra las existentes
        y crea las nuevas; no borra historial.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceMembersRequest'
      responses:
        '200':
          description: Membresias actuales despues del reemplazo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembersResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/wings/{wingId}/coverage:
    parameters:
      - name: wingId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getWingCoverage
      tags: [cobertura]
      security:
        - bearerAuth: []
      parameters:
        - name: at
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Instante ISO-8601 para consulta historica; por defecto now
      responses:
        '200':
          description: Coberturas vigentes del ala en el instante indicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoveragesResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: assignCoverage
      tags: [cobertura]
      security:
        - bearerAuth: []
      description: >-
        Asigna un grupo a un turno del ala. Si ya existe cobertura abierta
        para ese turno, la cierra antes de crear la nueva.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignCoverageRequest'
      responses:
        '200':
          description: Cobertura creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque token
  schemas:
    Shift:
      type: object
      required: [id, key, label, start_minute, sort_order]
      properties:
        id:
          type: string
        key:
          type: string
        label:
          type: string
        start_minute:
          type: integer
          minimum: 0
          maximum: 1439
        sort_order:
          type: integer
    ShiftGridResponse:
      type: object
      required: [facility_id, shifts, coverages_cleared]
      properties:
        facility_id:
          type: string
        shifts:
          type: array
          items:
            $ref: '#/components/schemas/Shift'
        coverages_cleared:
          type: integer
          description: Numero de coberturas cerradas al reemplazar la grilla
    ReplaceShiftGridRequest:
      type: object
      required: [shifts]
      properties:
        shifts:
          type: array
          items:
            type: object
            required: [key, label, start_minute]
            properties:
              key:
                type: string
              label:
                type: string
              start_minute:
                type: integer
                minimum: 0
                maximum: 1439
    StaffGroup:
      type: object
      required: [id, facility_id, name, created_at, updated_at]
      properties:
        id:
          type: string
        facility_id:
          type: string
        name:
          type: string
        retired_at:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    StaffGroupDetail:
      allOf:
        - $ref: '#/components/schemas/StaffGroup'
        - type: object
          required: [members]
          properties:
            members:
              type: array
              items:
                $ref: '#/components/schemas/Member'
    Member:
      type: object
      required: [id, staff_group_id, user_id, valid_from]
      properties:
        id:
          type: string
        staff_group_id:
          type: string
        user_id:
          type: string
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
          nullable: true
    StaffGroupsResponse:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/StaffGroup'
    StaffGroupResponse:
      type: object
      required: [group]
      properties:
        group:
          $ref: '#/components/schemas/StaffGroup'
    StaffGroupDetailResponse:
      type: object
      required: [group]
      properties:
        group:
          $ref: '#/components/schemas/StaffGroupDetail'
    MembersResponse:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'
    CreateStaffGroupRequest:
      type: object
      required: [facility_id, name]
      properties:
        facility_id:
          type: string
        name:
          type: string
    UpdateStaffGroupRequest:
      type: object
      properties:
        name:
          type: string
    ReplaceMembersRequest:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            type: object
            required: [user_id]
            properties:
              user_id:
                type: string
              valid_from:
                type: string
                format: date-time
                description: Inicio de la membresia; por defecto now
    WingCoverage:
      type: object
      required: [id, wing_id, shift_key, valid_from]
      properties:
        id:
          type: string
        wing_id:
          type: string
        staff_group_id:
          type: string
          nullable: true
        shift_key:
          type: string
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
          nullable: true
    CoveragesResponse:
      type: object
      required: [coverages]
      properties:
        coverages:
          type: array
          items:
            $ref: '#/components/schemas/WingCoverage'
    CoverageResponse:
      type: object
      required: [coverage]
      properties:
        coverage:
          $ref: '#/components/schemas/WingCoverage'
    AssignCoverageRequest:
      type: object
      required: [shift_key]
      properties:
        staff_group_id:
          type: string
          nullable: true
          description: null para limpiar cobertura
        shift_key:
          type: string
  responses:
    Unauthenticated:
      description: Token ausente o invalido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Capability insuficiente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Recurso duplicado o conflicto de estado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Datos de entrada invalidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
