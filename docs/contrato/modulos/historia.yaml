openapi: 3.1.0
info:
  title: Virtual Rounds Hub API - Historia Clinica
  version: 0.1.0
  description: >-
    Contrato HTTP del contexto de historia clinica: incidentes clinicos,
    revisiones y secuencia temporal. Sirve desde Rust.
servers:
  - url: http://localhost:8780
    description: Desarrollo local
tags:
  - name: historia
paths:
  /internal/v1/clinical/incidents:
    post:
      operationId: ingestIncident
      tags: [historia]
      security: []
      description: >-
        Ingesta de incidente clinico desde fuente externa (ej. deteccion de caidas).
        Idempotente por source_record_id.
      parameters:
        - name: x-clinical-secret
          in: header
          required: true
          schema:
            type: string
          description: Secreto compartido para autenticacion interna
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestIncidentRequest'
      responses:
        '200':
          description: Incidente duplicado (idempotente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestIncidentResponse'
        '201':
          description: Incidente creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestIncidentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/residents/{residentId}/incidents:
    parameters:
      - name: residentId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listIncidents
      tags: [historia]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Incidentes del residente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentsResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/incidents/{incidentId}/sequence:
    parameters:
      - name: incidentId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getIncidentSequence
      tags: [historia]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Detalle completo del incidente con revisiones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/incidents/{incidentId}:
    parameters:
      - name: incidentId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: reviewIncident
      tags: [historia]
      summary: Revisar un incidente
      description: >
        Mismo caso de uso que `POST /reviews`: una revision es append-only y el
        PATCH no muta la deteccion, agrega una revision. Existe porque es la
        forma que el cliente usa sobre el recurso.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
      responses:
        "200":
          description: Incidente con su revision nueva
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentResponse"

  /api/v1/incidents/{incidentId}/reviews:
    parameters:
      - name: incidentId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: createReview
      tags: [historia]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '200':
          description: Revision creada; incidente actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque token
    clinicalSecret:
      type: apiKey
      in: header
      name: x-clinical-secret
  schemas:
    IncidentView:
      type: object
      required: [id, resident_id, occurred_at, detection, reviews, current]
      properties:
        id:
          type: string
        resident_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        detection:
          $ref: '#/components/schemas/IncidentDetection'
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/ReviewView'
        current:
          $ref: '#/components/schemas/IncidentCurrent'
    IncidentDetection:
      type: object
      required: [kind, severity, injury_status, source, model_version]
      properties:
        kind:
          type: string
        severity:
          type: string
        injury_status:
          type: string
        source:
          type: string
        model_version:
          type: string
    IncidentCurrent:
      type: object
      required: [status]
      properties:
        status:
          type: string
        detection_verdict:
          type: string
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
    ReviewView:
      type: object
      required: [id, status, actor_id, created_at]
      properties:
        id:
          type: string
        status:
          type: string
        detection_verdict:
          type: string
          nullable: true
        review_note:
          type: string
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
        actor_id:
          type: string
        created_at:
          type: string
          format: date-time
    IngestIncidentRequest:
      type: object
      required: [source_record_id, resident_id, kind, severity, occurred_at, injury_status, source, model_version]
      properties:
        source_record_id:
          type: string
        resident_id:
          type: string
        bed_id:
          type: string
          nullable: true
        source_alert_id:
          type: string
          nullable: true
        kind:
          type: string
          enum: [fall, bed_exit, wandering, transfer, other]
        severity:
          type: string
          enum: [low, medium, high, critical]
        occurred_at:
          type: string
          format: date-time
        location:
          type: string
          nullable: true
        activity:
          type: string
          nullable: true
        injury_status:
          type: string
        self_recovery:
          type: boolean
          nullable: true
        response_seconds:
          type: integer
          nullable: true
        narrative:
          type: string
          nullable: true
        interventions_json:
          type: string
          nullable: true
        source:
          type: string
        model_version:
          type: string
        confidence:
          type: number
          format: float
          nullable: true
        provenance_json:
          type: string
          nullable: true
    IngestIncidentResponse:
      type: object
      required: [incident, duplicate]
      properties:
        incident:
          $ref: '#/components/schemas/IncidentView'
        duplicate:
          type: boolean
    IncidentsResponse:
      type: object
      required: [incidents]
      properties:
        incidents:
          type: array
          items:
            $ref: '#/components/schemas/IncidentView'
    IncidentDetailResponse:
      type: object
      required: [incident]
      properties:
        incident:
          $ref: '#/components/schemas/IncidentView'
    CreateReviewRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [open, under_review, closed]
        detection_verdict:
          type: string
          enum: [fall, not_a_fall, uncertain, safe_to_ground]
          nullable: true
        review_note:
          type: string
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
  responses:
    Unauthenticated:
      description: Token ausente o invalido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Capability insuficiente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Datos de entrada invalidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
