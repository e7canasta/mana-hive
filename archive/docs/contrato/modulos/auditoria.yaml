openapi: 3.1.0
info:
  title: Virtual Rounds Hub API - Auditoria
  version: 0.1.0
  description: >-
    Contrato HTTP del contexto de auditoria. La traza es append-only y los
    clientes solo pueden consultarla.
servers:
  - url: http://localhost:8780
    description: Desarrollo local
tags:
  - name: audit
paths:
  /api/v1/audit-log:
    get:
      operationId: listAuditLog
      tags: [audit]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: entity_type
          in: query
          required: false
          schema:
            type: string
        - name: entity_id
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Entradas de auditoria mas recientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    AuditEntry:
      type: object
      required: [id, actor_id, actor_name, action, entity_type, entity_id, metadata, created_at]
      properties:
        id:
          type: string
        actor_id:
          type: [string, 'null']
        actor_name:
          type: [string, 'null']
        action:
          type: string
        entity_type:
          type: string
        entity_id:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    AuditResponse:
      type: object
      required: [audit]
      properties:
        audit:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
  responses:
    Unauthenticated:
      description: Falta una sesion valida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Capability insuficiente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
