openapi: 3.1.0
info:
  title: Virtual Rounds Hub API - Identidad
  version: 0.1.0
  description: >-
    Contrato HTTP del contexto de identidad. El archivo se mantiene a mano;
    los DTOs Rust y los clientes TypeScript son implementaciones separadas.
servers:
  - url: http://localhost:8780
    description: Desarrollo local
tags:
  - name: identity
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesion creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [identity]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Actor autenticado
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [identity]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Sesion revocada
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/users:
    get:
      operationId: listUsers
      tags: [identity]
      security:
        - bearerAuth: []
      parameters:
        - name: include_inactive
          in: query
          required: false
          schema:
            type: string
            enum: ['0', '1']
            default: '0'
      responses:
        '200':
          description: Usuarios administrables
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createUser
      tags: [identity]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/users/{userId}:
    patch:
      operationId: updateUser
      tags: [identity]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    LoginResponse:
      type: object
      required: [token, expires_at, user]
      properties:
        token:
          type: string
          minLength: 1
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/AuthUser'
    AuthUser:
      type: object
      required: [id, username, display_name, role, features, permissions, capabilities]
      properties:
        id:
          type: string
        username:
          type: string
        display_name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        features:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        capabilities:
          type: array
          items:
            type: string
    AdminUser:
      type: object
      required: [id, username, display_name, role, active]
      properties:
        id:
          type: string
        username:
          type: string
        display_name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        job_title:
          type: [string, 'null']
        active:
          type: integer
          format: int32
          enum: [0, 1]
    Role:
      type: string
      enum: [supervisor, staff]
    CreateUserRequest:
      type: object
      required: [username, display_name, role, password]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
        display_name:
          type: string
          minLength: 1
        role:
          $ref: '#/components/schemas/Role'
        job_title:
          type: [string, 'null']
        password:
          type: string
          minLength: 6
    UpdateUserRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
        role:
          $ref: '#/components/schemas/Role'
        job_title:
          type: [string, 'null']
        active:
          type: boolean
        password:
          type: string
          minLength: 6
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
  responses:
    InvalidCredentials:
      description: Credenciales invalidas
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthenticated:
      description: Falta una sesion valida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Capability insuficiente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Conflicto de unicidad o estado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Recurso inexistente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Entrada invalida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Demasiados intentos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
